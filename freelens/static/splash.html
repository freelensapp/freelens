<html>
  <head>
    <title>ProLens</title>
    <style>
    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      margin: 0;
      padding: 0;
    }
    body {
      background: #1e2124;
      color: #6c757d;
      font-family: Arial, Helvetica, sans-serif;
    }
    .aligner-center-center {
      height: 100%;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .aligner-content {
      position: relative;
      width: 100%;
      padding: 80px;
    }
    .icon {
      position: relative;
      font-size: 36px;
      line-height: 54px;
      margin-bottom: 10px;
      text-align: center;
    }
    .icon svg {
      position: relative;
      display: inline-block;
      width: 54px;
      height: 54px;
      top: 14px;
    }
    .icon .icon-text {
      color: #fff;
      text-align: center;
      display: inline;
    }
    svg {
      position: relative;
      width: 100%;
    }
    .loading {
      padding-top: 10px;
      position: relative;
    }
    .bar {
      position: relative;
      height: 2px;
      background: #262b2f;
    }
    .progress {
      position: relative;
      height: 2px;
      background: #6366f1;
      box-shadow: 0 0 20px #6366f1;
      animation-name: loader-animation;
      animation-duration: 1.6s;
      animation-iteration-count: infinite;
      animation-timing-function: ease-in-out;
    }

    @keyframes loader-animation {
      0% {
        left: 0;
        width: 0px;
      }
      50% {
        left: 0;
        width: 100%;
      }
      100% {
        left: 100%;
        width: 0px;
      }
    }
    .glow-wrapper {
      position: relative;
      width: 100%;
      height: 2px;
      top: -2px;
    }

    .glow {
      height: 100%;
      display: flex;
      transform: translateZ(0);
    }

    .glow div {
      flex: 1;
      background: #6366f1;
      animation: glow 0.8s infinite alternate ease;
      box-shadow: 0 0 20px #6366f1;
    }

    .glow div.b1 {
      animation-delay: -0.72s;
    }
    .glow div.b2 {
      animation-delay: -0.64s;
    }
    .glow div.b3 {
      animation-delay: -0.56s;
    }
    .glow div.b4 {
      animation-delay: -0.48s;
    }
    .glow div.b5 {
      animation-delay: -0.4s;
    }
    .glow div.b6 {
      animation-delay: -0.32s;
    }
    .glow div.b7 {
      animation-delay: -0.24s;
    }
    .glow div.b8 {
      animation-delay: -0.16s;
    }
    .glow div.b9 {
      animation-delay: -0.08s;
    }

    @keyframes glow {
      100% {
        background: transparent;
        flex: 10;
        box-shadow: 0 0 0 transparent;
      }
    }

    .text {
      height: 20px;
      line-height: 20px;
      text-align: center;
      margin-top: 5px;
    }
    </style>
  </head>
  <body>
    <div class="aligner-center-center">
      <div class="aligner-content">
        <div class="icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
            <defs>
              <linearGradient id="prolens-bg" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#3B82F6" />
                <stop offset="1" stop-color="#8B5CF6" />
              </linearGradient>
              <radialGradient id="prolens-glow" cx="0.3" cy="0.25" r="0.9">
                <stop offset="0" stop-color="#ffffff" stop-opacity="0.22" />
                <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
              </radialGradient>
            </defs>
            <rect x="8" y="8" width="384" height="384" rx="88" fill="url(#prolens-bg)" />
            <rect x="8" y="8" width="384" height="384" rx="88" fill="url(#prolens-glow)" />
            <circle cx="200" cy="200" r="138" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="6" />
            <path d="M211 156L281.91 115.06A118 118 0 0 1 316.76 217.06Z" fill="#ffffff" fill-opacity="1" />
            <path d="M243.61 187.53L314.51 228.47A118 118 0 0 1 243.61 309.65Z" fill="#ffffff" fill-opacity="0.86" />
            <path d="M232.61 231.53L232.61 313.41A118 118 0 0 1 126.84 292.59Z" fill="#ffffff" fill-opacity="1" />
            <path d="M189 244L118.09 284.94A118 118 0 0 1 83.24 182.94Z" fill="#ffffff" fill-opacity="0.86" />
            <path d="M156.39 212.47L85.49 171.53A118 118 0 0 1 156.39 90.35Z" fill="#ffffff" fill-opacity="1" />
            <path d="M167.39 168.47L167.39 86.59A118 118 0 0 1 273.16 107.41Z" fill="#ffffff" fill-opacity="0.86" />
          </svg>
          <div class="icon-text">ProLens</div>
        </div>
        <div class="loading">
          <div class="bar">
            <div class="progress"></div>
          </div>
          <div class="glow-wrapper">
            <div class="glow">
              <div class="b1"></div>
              <div class="b2"></div>
              <div class="b3"></div>
              <div class="b4"></div>
              <div class="b5"></div>
              <div class="b6"></div>
              <div class="b7"></div>
              <div class="b8"></div>
              <div class="b9"></div>
            </div>
          </div>
          <div class="text">Loading...</div>
        </div>
      </div>
    </div>
  </body>
</html>
