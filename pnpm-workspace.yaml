catalogs:
  # Runtime dependencies of the published @freelensapp/extensions package.
  # pnpm inlines the catalog specifier verbatim into the published
  # package.json, so these must stay ranges: an exact pin would force every
  # extension author onto one patch release and can end up with duplicated
  # react/mobx instances, which breaks the singletons the extension API
  # relies on. Versions here intentionally duplicate the default catalog and
  # must be kept in sync with it.
  extensions:
    '@mui/material': ^9.2.0
    '@ogre-tools/injectable': ^23.2.0
    '@ogre-tools/injectable-react': ^23.2.0
    '@types/node': ~24.12.4
    '@types/react': ^19.2.17
    '@types/react-table': ^7.7.20
    '@xterm/xterm': ^6.0.0
    chart.js: ^4.5.1
    conf: ^15.1.0
    history: ^5.3.0
    immer: ^11.1.8
    mobx: ^6.15.0
    monaco-editor: ^0.56.0
    node-fetch: ^3.3.2
    react: ^19.2.8
    react-select: ^5.10.2
    react-table: ^7.8.0
    react-window: ^2.3.0
    rfc6902: ^5.2.0
    type-fest: ^5.6.0
    typed-emitter: ^2.1.0

allowBuilds:
  '@parcel/watcher': true
  electron: true
  electron-winstaller: false
  esbuild: false
  node-pty: true
  sharp: true

engineStrict: true

overrides:
  form-data: ^4.0.6
  http-proxy: npm:http-proxy-node16@^1.0.6
  mobx-react: ^9.1.1
  tmp@^0.2.0: ^0.2.7

peerDependencyRules:
  allowedVersions:
    mobx-react: '9'

patchedDependencies:
  '@async-fn/vitest': patches/@async-fn__vitest.patch
  '@xterm/xterm@6.0.0': patches/@xterm__xterm@6.0.0.patch

shellEmulator: true

minimumReleaseAgeExclude:
  - react-dom@19.2.8
  - react@19.2.8
