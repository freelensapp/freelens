catalogs:
  # Runtime dependencies of the published @freelensapp/extensions package.
  # pnpm inlines the catalog specifier verbatim into the published
  # package.json, so these must stay ranges: an exact pin would force every
  # extension author onto one patch release and can end up with duplicated
  # react/mobx instances, which breaks the singletons the extension API
  # relies on. Versions here intentionally duplicate the default catalog and
  # must be kept in sync with it.
  extensions:
    '@types/react': ^19.3.0
    '@types/react-dom': ^19.3.0
    chart.js: ^4.6.1
    conf: ^16.0.0
    es-toolkit: ^1.52.0
    immer: ^11.1.21
    mobx: ^7.0.6
    mobx-react: ^10.0.2
    monaco-editor: ^0.57.0
    react: ^19.3.1
    react-dom: ^19.3.1
    react-select: ^5.10.2
    rfc6902: ^5.3.0
    type-fest: ^5.10.0

allowBuilds:
  '@parcel/watcher': true
  electron: true
  electron-winstaller: false
  esbuild: false
  node-pty: true
  pnpm: true
  sharp: true

engineStrict: true

# Releases let in before pnpm's minimumReleaseAge, one exact version each, for
# security fixes that cannot wait. Remove an entry once that version is older
# than the policy: the exclusion is then a no-op.
minimumReleaseAgeExclude:
  # Node 24.22.1, the fix of CVE-2026-111497.
  - electron@44.10.0

overrides:
  # @kubernetes/client-node declares @types/node of a newer major than the
  # catalog's as a runtime dependency. Left alone it installs a second copy of
  # the Node typings next to the catalog's, which then also becomes vite's
  # resolved peer. The app targets the Node version of .nvmrc, so keep the
  # whole tree on one copy, at the catalog's version. Renovate updates the two
  # together.
  '@kubernetes/client-node>@types/node': 24.19.2
  form-data: ^4.0.6
  # Nothing depends on http-proxy today: this override is a guard, not dead
  # code. The original package is abandoned with a known CVE, so a dependency
  # that starts to pull it in gets the maintained rewrite the app uses instead.
  http-proxy: npm:http-proxy-3@^2.0.2
  # @ogre-tools/injectable-react peers mobx-react ^9. Left alone, pnpm
  # auto-installs a second mobx-react 9 for every package that lacks a direct
  # mobx-react, and the MobX family must stay a singleton. Pointing the
  # override at the catalog rewrites that peer to the pinned version, without
  # resolving to anything newer than the pin.
  mobx-react: 'catalog:'
  # monaco-editor pins dompurify 3.4.15, which GHSA-cg2g-xh64-v4q7 affects, and
  # also vendors a copy of it that its sanitizer imports instead of the
  # package. The patch of patchedDependencies points that import at the
  # package, and this override puts the package on the catalog's version, so
  # the renderer bundles one DOMPurify, the fixed one. Remove both when a
  # monaco-editor release ships DOMPurify 3.4.17 or newer; the patch is keyed
  # by the exact version, so a monaco-editor bump reports it as unused.
  monaco-editor>dompurify: 'catalog:'
  tmp@^0.2.0: ^0.2.7

peerDependencyRules:
  # These rules silence peers that still ask for mobx 6 and have no release
  # for mobx 7. Each package they cover must stay safe on mobx 7:
  # - @ogre-tools/injectable-react (mobx ^6) imports neither mobx nor
  #   mobx-react, in its build or in its typings;
  # - @ogre-tools/injectable-extension-for-mobx (mobx ^6) uses only `computed`,
  #   `createAtom` and `runInAction`, and types with `IComputedValue` only,
  #   all of which mobx 7 keeps unchanged;
  # - mobx-utils (mobx ^6) works for `now`, `fromResource` and `fromPromise`.
  #   Its classes are built with legacy decorators: `createViewModel` and
  #   `fromStream` throw on mobx 7 (`Reflect.ownKeys called on non-object`
  #   from `makeObservable(this)`), because the removed `observable.ref` /
  #   `action.bound` are skipped and leave no annotations behind. Do not use
  #   `createViewModel`, `fromStream` or `toStream`.
  # Check any new package these rules start to cover the same way.
  allowedVersions:
    mobx: '7'

patchedDependencies:
  '@async-fn/vitest': patches/@async-fn__vitest.patch
  '@xterm/xterm@6.0.0': patches/@xterm__xterm@6.0.0.patch
  monaco-editor@0.57.0: patches/monaco-editor@0.57.0.patch

shellEmulator: true
