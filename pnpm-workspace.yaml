packages:
  - freelens
  - packages/**

# Versions here are pinned exactly. Every workspace package resolves its
# dependencies through this catalog, so the pinned version is what the app is
# built and tested against. Renovate (rangeStrategy: bump) raises a PR for
# every update anyway, so ranges bought us no flexibility.
