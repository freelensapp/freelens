catalogs:
  # Runtime dependencies of the published @freelensapp/extensions package.
  # pnpm inlines the catalog specifier verbatim into the published
  # package.json, so these must stay ranges: an exact pin would force every
  # extension author onto one patch release and can end up with duplicated
  # react/mobx instances, which breaks the singletons the extension API
  # relies on. Versions here intentionally duplicate the default catalog and
  # must be kept in sync with it.
  extensions:
    '@types/react': ^19.3.0
    '@types/react-dom': ^19.3.0
    chart.js: ^4.5.1
    conf: ^15.1.0
    es-toolkit: ^1.49.0
    immer: ^11.1.21
    mobx: ^7.0.6
    mobx-react: ^10.0.2
    monaco-editor: ^0.57.0
    react: ^19.3.0
    react-select: ^5.10.2
    rfc6902: ^5.2.0
    type-fest: ^5.6.0

allowBuilds:
  '@parcel/watcher': true
  electron: true
  electron-winstaller: false
  esbuild: false
  node-pty: true
  pnpm: true
  sharp: true

engineStrict: true

overrides:
  # @kubernetes/client-node declares @types/node ^26 as a runtime dependency.
  # Left alone it installs a second major of the Node typings next to the
  # catalog's 24.19.0, which then also becomes vite's resolved peer. The app
  # targets Node 24 (.nvmrc), so keep the whole tree on one copy.
  '@kubernetes/client-node>@types/node': 24.19.1
  form-data: ^4.0.6
  # Nothing depends on http-proxy today: this override is a guard, not dead
  # code. The original package is abandoned with a known CVE, so a dependency
  # that starts to pull it in gets the maintained rewrite the app uses instead.
  http-proxy: npm:http-proxy-3@^2.0.1
  mobx-react: ^10.0.2
  tmp@^0.2.0: ^0.2.7

peerDependencyRules:
  # These rules silence peers that still ask for mobx 6 / mobx-react 9 and have
  # no release for mobx 7. Each package they cover must stay safe on mobx 7:
  # - @ogre-tools/injectable-react (mobx ^6, mobx-react ^9) imports neither
  #   mobx nor mobx-react, in its build or in its typings;
  # - @ogre-tools/injectable-extension-for-mobx (mobx ^6) uses only `computed`,
  #   `createAtom` and `runInAction`, and types with `IComputedValue` only,
  #   all of which mobx 7 keeps unchanged;
  # - mobx-utils (mobx ^6) works for `now`, `fromResource` and `fromPromise`.
  #   Its classes are built with legacy decorators: `createViewModel` and
  #   `fromStream` throw on mobx 7 (`Reflect.ownKeys called on non-object`
  #   from `makeObservable(this)`), because the removed `observable.ref` /
  #   `action.bound` are skipped and leave no annotations behind. Do not use
  #   `createViewModel`, `fromStream` or `toStream`.
  # Check any new package these rules start to cover the same way.
  allowedVersions:
    mobx: '7'
    mobx-react: '10'

patchedDependencies:
  '@async-fn/vitest': patches/@async-fn__vitest.patch
  '@xterm/xterm@6.0.0': patches/@xterm__xterm@6.0.0.patch
  # Keeps a namespace import whose members a declaration names only by
  # qualified name (`typeof utilities.X`, `utilities.Y`) from pulling the whole
  # namespace object, and every member of the module, into the extension API
  # declaration. Without it the members `common-api/utils.ts` omits from `Util`
  # come back, with their `node:` imports.
  rolldown-plugin-dts@0.28.6: patches/rolldown-plugin-dts@0.28.6.patch

shellEmulator: true

minimumReleaseAgeExclude:
  - react-dom@19.2.8
  - react@19.2.8
