  # React family (singletons)
  react: 19.3.1
  react-dom: 19.3.1
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  # MobX family (singletons)
  mobx: 7.0.6
  mobx-react: 10.0.2
  # TypeScript
  typescript: 7.0.2
  # Dependency injection (Ogre Tools)
  '@ogre-tools/injectable': 27.0.0
