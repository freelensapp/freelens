packages:
  - freelens
  - packages/**

catalog:
  # React family (singletons)
  react: ^19.2.8
  react-dom: ^19.2.8
  '@types/react': ^19.2.17
  '@types/react-dom': ^19.2.3
  # MobX family (singletons)
  mobx: ^6.15.0
  mobx-react: ^9.1.1
  mobx-react-lite: ^4.1.1
  # TypeScript
  typescript: ^7.0.2
  # Testing stack
  vitest: ^4.1.10
  '@testing-library/dom': ^10.4.1
  '@testing-library/jest-dom': ^7.0.0
  '@testing-library/react': ^16.3.2
  '@testing-library/user-event': ^14.6.1
  jsdom: ^29.1.1
  vitest-canvas-mock: ^1.1.4
  vitest-mock-extended: ^5.1.0
  # Types and utilities
  '@types/node': ~24.12.4
  type-fest: ^5.6.0
  # Shared libraries
  chart.js: ^4.5.1
  immer: ^11.1.8
  monaco-editor: ^0.55.1

allowBuilds:
  '@parcel/watcher': true
  electron: true
  electron-winstaller: false
  esbuild: false
  node-pty: true
  sharp: true

engineStrict: true

overrides:
  form-data: ^4.0.6
  http-proxy: npm:http-proxy-node16@^1.0.6
  mobx-react: ^9.1.1
  tmp@^0.2.0: ^0.2.7

peerDependencyRules:
  allowedVersions:
    mobx-react: '9'

patchedDependencies:
  '@async-fn/vitest': patches/@async-fn__vitest.patch
  '@xterm/xterm@6.0.0': patches/@xterm__xterm@6.0.0.patch

shellEmulator: true

minimumReleaseAgeExclude:
  - react-dom@19.2.8
  - react@19.2.8
