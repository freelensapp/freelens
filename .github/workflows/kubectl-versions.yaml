name: Automated kubectl versions

on:
  issue_comment:
    types:
      - created
  schedule:
    - cron: 26 6 * * *
  workflow_dispatch: {}

permissions:
  contents: write
  id-token: write
  pull-requests: write

jobs:
  kubectl-versions:
    name: kubectl versions

    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: ubuntu-24.04-arm
            arch: arm64

    runs-on: ${{ matrix.runs-on }}
    environment: automated
    # Regenerating binaries.lock.json downloads all eighteen artifacts, and
    # pinning the kubectl checksums adds six more per minor that moved - a
    # typical patch release day touches three, so around a gigabyte on top.
    timeout-minutes: 45

    if: >-
      github.event_name != 'issue_comment' || (startsWith(github.event.issue.title, 'Automated update of kubectl versions') && contains(github.event.comment.body, '/rerun'))

    env:
      DO_NOT_TRACK: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      # yq and cosign come from mise so that their versions have a single
      # source (mise.toml) and the downloads are verified against mise.lock.
      # cosign is needed to regenerate binaries.lock.json and to pin the
      # kubectl checksums below.
      - name: Set up mise
        uses: jdx/mise-action@v4
        with:
          version: 2026.7.13 # datasource=github-releases depName=jdx/mise
          install_args: yq cosign

      - name: Setup pnpm
        run: corepack enable

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install pnpm dependencies
        id: install-pnpm
        run: timeout 300 pnpm install --color=always --prefer-offline --frozen-lockfile
        continue-on-error: true

      - name: Install pnpm dependencies (retry)
        if: steps.install-pnpm.outcome == 'failure'
        run: timeout 300 pnpm install --color=always --prefer-offline --frozen-lockfile

      - name: kubectl versions
        run: pnpm --color=always compute-versions

      # Every version the map names is one the application may download at
      # runtime, so each needs a digest that was verified against upstream's
      # signature. The generator only adds what is missing, which is six
      # artifacts per minor that moved, and never rewrites an existing pin.
      - name: Update the kubectl checksums
        run: pnpm --color=always update-kubectl-checksums

      - name: Bundle the latest kubectl version
        run: |
          cat packages/kubectl-versions/build/versions.json | yq -pj -oy '.[-1][-1]' > .github/version.log
          version=$(cat .github/version.log)
          yq -pj -oj -i '.config.bundledKubectlVersion="'"$version"'"' freelens/package.json
          echo "Bundled kubectl version $version" > .github/pr_body.log

      # The build verifies every download against binaries.lock.json, so the
      # bump above is incomplete without the matching digests. Regenerating
      # here keeps the version and its pins in one commit, and re-checks every
      # publisher signature on the way.
      - name: Update the binaries lock
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm --color=always update-binaries-lock

      - name: Check for changes
        run: |
          if git diff --exit-code; then
            echo "changes=false" | tee -a $GITHUB_ENV
          else
            echo "changes=true" | tee -a $GITHUB_ENV
          fi

      - name: Commit and push to branch
        if: env.changes == 'true'
        uses: EndBug/add-and-commit@v10
        with:
          github_token: ${{ secrets.GH_TOKEN }}
          default_author: github_actions
          message: Automated update of kubectl versions
          new_branch: automated/kubectl-versions
          push: origin automated/kubectl-versions --set-upstream --force

      - name: Create pull request
        if: env.changes == 'true'
        run: |-
          kubectl_version=$(cat .github/version.log)
          if [[ $(gh pr view automated/kubectl-versions --json state --jq .state || true) != "OPEN" ]]; then
            gh pr create \
              --head automated/kubectl-versions \
              --title "Automated update of kubectl versions (bundled ${kubectl_version})" \
              --body-file .github/pr_body.log \
              --label automated \
              --label kubectl
          else
            gh pr edit automated/kubectl-versions \
              --title "Automated update of kubectl versions (bundled ${kubectl_version})" \
              --body-file .github/pr_body.log
          fi
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Close pull request
        if: env.changes == 'false'
        run: gh pr list --head automated/kubectl-versions --json number --jq '.[].number' | xargs -rn1 gh pr close --delete-branch
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
