name: Knip

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "*"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  knip:
    name: knip

    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: ubuntu-26.04-arm
            arch: arm64

    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 15

    env:
      DO_NOT_TRACK: "1"
      TURBOREPO_CACHE: ${{ github.workspace }}/.turbo

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Setup pnpm
        run: corepack enable

      - name: Get pnpm cache directory
        shell: bash
        run: |
          pnpm_cache_dir="$(pnpm store path)"
          echo "pnpm_cache_dir=${pnpm_cache_dir}" | tee -a "${GITHUB_ENV}"

      - name: Use pnpm cache
        uses: actions/cache@v6
        with:
          path: ${{ env.pnpm_cache_dir }}
          key: ${{ matrix.runs-on }}-${{ matrix.arch }}-node-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ matrix.runs-on }}-${{ matrix.arch }}-node-

      - name: Use Turborepo cache
        uses: actions/cache@v6
        with:
          path: ${{ env.TURBOREPO_CACHE }}
          key: ${{ matrix.runs-on }}-${{ matrix.arch }}-turborepo-${{ hashFiles('package.json', 'freelens/package.json', 'packages/**/package.json', 'pnpm-lock.yaml','turbo.json','tsconfig*.json','packages/infrastructure/typescript/config/*.json') }}
          restore-keys: |
            ${{ matrix.runs-on }}-${{ matrix.arch }}-turborepo-

      # Turborepo does not cache the binaries, see "Bundled Binary Versions"
      # in AGENTS.md. Saved right after the build.
      - name: Restore bundled binaries cache
        id: binaries-cache-restore
        uses: actions/cache/restore@v6
        with:
          path: freelens/binaries
          key: ${{ runner.os }}-${{ runner.arch }}-binaries-${{ hashFiles('freelens/binaries.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-binaries-

      - name: Install pnpm dependencies
        id: install-pnpm
        run: timeout 300 pnpm install --color=always --prefer-offline --frozen-lockfile
        continue-on-error: true

      - name: Install pnpm dependencies (retry)
        if: steps.install-pnpm.outcome == 'failure'
        run: timeout 300 pnpm install --color=always --prefer-offline --frozen-lockfile

      - name: Build packages
        run: pnpm --color=always --stream build

      - name: Save bundled binaries cache
        if: steps.binaries-cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: freelens/binaries
          key: ${{ steps.binaries-cache-restore.outputs.cache-primary-key }}

      - name: Run Knip
        run: pnpm --color=always --stream knip:check
