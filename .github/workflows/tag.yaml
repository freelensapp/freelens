name: Automated tag

on:
  issue_comment:
    types:
      - created
  pull_request:
    branches:
      - main
    types:
      - closed

permissions:
  contents: write
  id-token: write
  pull-requests: read

jobs:
  create-tag:
    name: tag

    runs-on: ubuntu-24.04-arm
    environment: automated
    timeout-minutes: 10

    env:
      DO_NOT_TRACK: "1"

    if: >
      (startsWith(github.event.issue.title, 'Automated npm version') && github.event.issue.state == 'closed' && github.event.comment.body == '/tag' && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) || (startsWith(github.event.pull_request.title, 'Automated
      npm version') && github.event.pull_request.merged)
    steps:
      # author_association in the job condition is only a cheap pre-filter:
      # MEMBER and COLLABORATOR do not imply write access. The permission API
      # reports maintain as write and triage as read, and a failed lookup
      # fails the job, so an unknown permission never passes.
      - name: Require write access
        if: github.event_name == 'issue_comment'
        shell: bash
        run: |
          PERMISSION=$(gh api "repos/${GITHUB_REPOSITORY}/collaborators/${COMMENTER}/permission" --jq '.permission')
          echo "Permission of ${COMMENTER}: ${PERMISSION}"
          case "$PERMISSION" in
            admin|write) ;;
            *)
              echo "::error::${COMMENTER} needs write access to the repository to run this workflow"
              exit 1
              ;;
          esac
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENTER: ${{ github.event.comment.user.login }}

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main

      # yq comes from mise so that its version has a single source (mise.toml)
      # and the download is verified against mise.lock.
      - name: Set up mise
        uses: jdx/mise-action@v5
        with:
          version: 2026.10.3 # datasource=github-releases depName=jdx/mise
          install_args: yq

      - name: Get version from package.json
        id: package-json
        run: |
          echo "version=$(yq -pj -oy -r .version freelens/package.json)" >> $GITHUB_OUTPUT

      - name: Check if version is release
        id: check-version
        run: |
          if [[ "${{ steps.package-json.outputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "is_release=true" >> $GITHUB_OUTPUT
          else
            echo "is_release=false" >> $GITHUB_OUTPUT
          fi

      - name: Create tag from the main branch
        if: steps.check-version.outputs.is_release == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const mainRef = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'heads/main',
            });
            const result = await github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'refs/tags/v${{ steps.package-json.outputs.version }}',
              sha: mainRef.data.object.sha,
            });
            console.log(result);
          github-token: ${{ secrets.GH_TOKEN }}
