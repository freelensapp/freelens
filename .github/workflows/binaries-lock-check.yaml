name: Binaries Lock Check

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/binaries-lock-check.yaml
      - freelens/binaries.lock.json
      - freelens/package.json
      - packages/ensure-binaries/**
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    name: Check binaries.lock.json

    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30

    env:
      DO_NOT_TRACK: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      # yq and cosign come from mise so that their versions have a single
      # source (mise.toml) and the downloads are verified against mise.lock.
      # cosign is what checks kubectl's keyless signature; the other two tools
      # are verified in pure JavaScript.
      - name: Set up mise
        uses: jdx/mise-action@v4
        with:
          version: 2026.7.13 # datasource=github-releases depName=jdx/mise
          install_args: yq cosign

      - name: Setup pnpm
        run: corepack enable

      - name: Install pnpm dependencies
        run: timeout 300 pnpm install --color=always --prefer-offline --frozen-lockfile

      # Regenerating downloads all eighteen artifacts, checks each against its
      # publisher's signature and rewrites the lock. Because the generator sorts
      # its output, an unchanged set of artifacts produces a byte-identical file
      # and this diff stays empty. A non-empty diff means either the lock was
      # not regenerated after a version bump, or a published artifact changed.
      - name: Regenerate the lock
        env:
          # Build provenance is read from the GitHub API, which allows only 60
          # unauthenticated calls per hour per IP - shared runners exhaust that.
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm --color=always update-binaries-lock

      - name: Check the lock is up to date
        run: |-
          if git diff --exit-code --stat freelens/binaries.lock.json; then
            echo "freelens/binaries.lock.json is up to date."
            exit 0
          fi

          echo "::error::freelens/binaries.lock.json is out of date. Run \`pnpm update-binaries-lock\` and commit the result." >&2
          git --no-pager diff freelens/binaries.lock.json
          exit 1

      # The check above proves the lock matches what the vendors serve today. It
      # cannot tell a legitimate version bump from an artifact swapped behind an
      # unchanged URL, because both simply produce a new digest. Comparing
      # against the base commit does: keyed on tool + version + platform, so a
      # bump or a newly added platform is not flagged, but a digest that moved
      # while its version stood still is.
      - name: Check for replaced artifacts
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |-
          set -eo pipefail

          if [ -z "$BASE_SHA" ]; then
            echo "Not a pull request, nothing to compare."
            exit 0
          fi

          flatten() {
            yq -pj -ot '
              [
                to_entries[] as $tool
                | $tool.value.artifacts | to_entries[]
                | {
                    "tool": $tool.key,
                    "version": $tool.value.version,
                    "platform": .key,
                    "sha256": .value.sha256
                  }
              ]
            ' "$1" | tail -n +2 | sort
          }

          if ! git show "$BASE_SHA:freelens/binaries.lock.json" > base.lock.json 2> /dev/null; then
            echo "No binaries.lock.json on the base commit, nothing to compare."
            exit 0
          fi

          flatten base.lock.json > base.tsv
          flatten freelens/binaries.lock.json > head.tsv

          awk -F'\t' '
            NR == FNR { base[$1 FS $2 FS $3] = $4; next }
            ($1 FS $2 FS $3) in base && base[$1 FS $2 FS $3] != $4 {
              printf "  %s %s (%s)\n    was: %s\n    now: %s\n", $1, $2, $3, base[$1 FS $2 FS $3], $4
              found = 1
            }
            END { exit found ? 1 : 0 }
          ' base.tsv head.tsv && {
            echo "No digest changed for an unchanged tool version."
            exit 0
          }

          echo "::error::A digest changed without a version change - the artifact behind a pinned URL was replaced." >&2
          exit 1
