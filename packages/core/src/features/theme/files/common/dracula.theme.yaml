# yaml-language-server: $schema=https://raw.githubusercontent.com/freelensapp/freelens/main/schemas/theme-v1.schema.json
#
# A built-in theme of Freelens, Dracula: Dracula Classic and Alucard Classic. It sets every
# token, so nothing of it comes from the default theme, freelens.
#
# The colors are those of Dracula, https://draculatheme.com: the color palettes, the UI
# palettes, the ANSI palettes and the syntax highlighting rules of the Dracula specification,
# https://draculatheme.com/spec. The text on the accent is the background of Dracula Classic
# and white on Alucard Classic, so that it reaches the WCAG AA contrast on every accent
# background. Nothing of the commercial Dracula PRO is used.
