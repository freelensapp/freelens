# yaml-language-server: $schema=https://raw.githubusercontent.com/freelensapp/freelens/main/schemas/theme-v1.schema.json
#
# A built-in theme of Freelens, Ayu Mirage: Ayu Mirage and Ayu Light. It sets every token, so nothing
# of it comes from the default theme, freelens.
#
# The colors are those of Ayu, https://ayutheme.com/: the palettes of ayu-colors,
# https://github.com/ayu-theme/ayu-colors, and the editor themes of vscode-ayu,
# https://github.com/ayu-theme/vscode-ayu. The text on the accent is darker than Ayu's own
# `accent.on`, so that it reaches the WCAG AA contrast on every accent background.
