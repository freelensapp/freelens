# yaml-language-server: $schema=https://raw.githubusercontent.com/freelensapp/freelens/main/schemas/theme-v1.schema.json
#
# A built-in theme of Freelens, Solarized: Solarized Dark and Solarized Light. It sets every
# token, so nothing of it comes from the default theme, freelens.
#
# The colors are those of Solarized by Ethan Schoonover, https://ethanschoonover.com/solarized/:
# the sixteen colors of https://github.com/altercation/solarized, base03 to base3 and the eight
# accents. The light variant swaps the base colors of the dark one as Solarized defines: base03
# with base3, base02 with base2, base01 with base1 and base00 with base0. The background is base03
# (base3), and base02 (base2), Solarized's background highlights, marks the hover, selected and
# active states. The terminal colors are Solarized's own ANSI mapping, the same in both variants,
# from `xresources/solarized`, and the editor colors follow the syntax groups of the Vim theme,
# `vim-colors-solarized/colors/solarized.vim`.
#
# A base color that Freelens draws as text the user has to read and that does not reach the WCAG
# AA contrast on its background is replaced with the next base color that does: the secondary
# text, base01 (base1), takes base0 (base01), and in the light variant the body text, base00,
# takes base01, also in the terminal and the editor. The emphasized text of the light variant,
# which sits on base2 too, takes base02. A status or named color that does not reach the WCAG AA
# contrast as text on base03 (base3) is replaced with the closest color of the same hue that does.
# Decorative uses, the dimmed text, borders, comments and the syntax and ANSI colors, keep the
# original colors. The accent is Solarized blue, with base03 darkened to the WCAG AA contrast on it
# as its text in both variants. The red of the buttons that carry white text is Solarized red.
#
