# yaml-language-server: $schema=https://raw.githubusercontent.com/freelensapp/freelens/main/schemas/theme-v1.schema.json
#
# A built-in theme of Freelens, High Contrast: High Contrast Dark and High Contrast Light. It sets
# every token, so nothing of it comes from the default theme, freelens. It is a design of Freelens
# of its own, for users who need stronger contrast than the other themes give.
#
# The surfaces are black (white) with a single step, #1a1a1a (#ebebeb), for headers and for the
# hovered, selected and active states; the surfaces are told apart by borders rather than by shades.
# Every color drawn as text, the secondary, tertiary and dimmed text, the status colors and the
# accent included, reaches the WCAG AAA contrast, 7:1, on both surfaces. Borders and separators
# reach 3:1 on both. The white text of default and destructive buttons and of dialog headers, and
# the text on the accent, reach 7:1 on their backgrounds; the white text of disabled buttons
# reaches 4.5:1. The selected table row, the active tab and the active sidebar item carry the accent
# as a bar, an underline or a background, so they do not rely on a shade alone.
#
# The accent is cyan with black text in the dark variant, and a deep blue with white text in the
# light one. The status colors are distinct hues: green for success, blue for information, red for
# errors, orange for soft errors and yellow for warnings, with gray for terminated objects.
#
# Every ANSI color of the terminal, the bright ones included, reaches 7:1 on its background, which
# makes ANSI black a gray in the dark variant and ANSI white a gray in the light one. The editor
# extends Monaco's own high contrast themes, hc-black and hc-light, and every color of its tokens
# reaches 7:1 on both the background and the highlighted line.
