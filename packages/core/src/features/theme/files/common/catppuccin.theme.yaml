# yaml-language-server: $schema=https://raw.githubusercontent.com/freelensapp/freelens/main/schemas/theme-v1.schema.json
#
# A built-in theme of Freelens, Catppuccin: Mocha and Latte. It sets every token, so nothing of
# it comes from the default theme, freelens.
#
# The colors are those of Catppuccin, https://catppuccin.com: the colors and the ANSI colors of
# Mocha and Latte in `palette.json` of https://github.com/catppuccin/palette, and the editor
# colors and syntax highlighting of the official VS Code port, https://github.com/catppuccin/vscode.
# The accent is Catppuccin's own Mauve, with Crust on it in Mocha and Base in Latte, which reach
# the WCAG AA contrast on every accent background. A status or named color that does not reach
# the WCAG AA contrast as text on Base is replaced with the closest color of the same hue that
# does, which darkens most of them in Latte. The red of the buttons that carry white text is the
# Red of Latte in both variants.
