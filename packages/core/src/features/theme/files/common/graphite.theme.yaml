# yaml-language-server: $schema=https://raw.githubusercontent.com/freelensapp/freelens/main/schemas/theme-v1.schema.json
#
# A built-in theme of Freelens, Graphite: Graphite and Graphite Light. It sets every token, so
# nothing of it comes from the default theme, freelens.
#
# The colors are those of Graphite, the calm and clean theme for Home Assistant by Tilman
# Griesel, https://graphite.rocketengine.io/: the `token-*` variables and the code editor colors
# of `themes/graphite.yaml` and `themes/graphite-light.yaml` of
# https://github.com/TilmanGriesel/graphite. Colors with an alpha are blended onto the background
# they sit on where they are text. A feedback or named color that does not reach the WCAG AA
# contrast as text on the backgrounds of a variant is replaced with the closest color of the same
# hue that does. The text on the orange accent is the base background of Graphite and the primary
# text of Graphite Light, which both reach the WCAG AA contrast on every accent background.
# Graphite has no terminal palette: the ANSI colors are its named colors.
#
