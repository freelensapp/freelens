# This file controls the behavior of Trunk: https://docs.trunk.io/cli
# To learn more about the format of this file, see https://docs.trunk.io/reference/trunk-yaml
version: 0.1
cli:
  version: 1.25.0
# Trunk provides extensibility via plugins. (https://docs.trunk.io/plugins)
plugins:
  sources:
    - id: trunk
      ref: v1.11.0
      uri: https://github.com/trunk-io/plugins
# Many linters and tools depend on runtimes - configure them here. (https://docs.trunk.io/runtimes)
runtimes:
  enabled:
    - go@1.21.0
    - node@24.22.1! # datasource=node-version depName=node
    - python@3.14.4
# actionlint comes from the maintained fork of kjanat, which continues the
# releases of rhysd/actionlint after 1.7.12 with the same names of the files,
# where the plugin downloads them from rhysd/actionlint.
downloads:
  - name: actionlint
    downloads:
      - os:
          linux: linux
          macos: darwin
        cpu:
          x86_64: amd64
          arm_64: arm64
        url: https://github.com/kjanat/actionlint/releases/download/v${version}/actionlint_${version}_${os}_${cpu}.tar.gz
      - os: windows
        cpu:
          x86_64: amd64
          arm_64: arm64
        url: https://github.com/kjanat/actionlint/releases/download/v${version}/actionlint_${version}_windows_${cpu}.zip
# This is the section where you manage your linters. (https://docs.trunk.io/check/configuration)
lint:
  # Trunk's built-in `javascript` file type does not match `.cjs` (or `.mjs`),
  # so Biome would never lint the CommonJS build hook scripts. Define an extra
  # file type covering those extensions and add it to the Biome definition.
  files:
    - name: commonjs
      extensions:
        - cjs
        - mjs
  definitions:
    # shfmt ignores .editorconfig when it is given any formatting flag, and
    # the plugin passes `-s`, so it would indent with tabs regardless of
    # indent_style. Run it without flags; `simplify = true` in .editorconfig
    # keeps the simplification.
    - name: shfmt
      commands:
        - name: format
          output: shfmt
          run: shfmt -w ${target}
          success_codes: [0, 1]
          cache_results: true
          formatter: true
          batch: true
          in_place: true
    # See https://github.com/trunk-io/plugins/pull/1063
    # parse_regex is matched against the whole output of a batch, so `^`
    # needs `(?m)` to match at every line; without it Trunk reports only the
    # first issue Biome prints and silently drops the rest.
    #
    # Trunk runs biome on a copy of the files in a sandbox outside the
    # repository, pointing it back at biome.jsonc with --config-path. With
    # vcs.useIgnoreFile on, biome 2.5.15 matches every target against the
    # repository's .gitignore and panics on a path outside the repository root
    # ("path is expected to be under the root"), so every file fails. Trunk
    # applies .gitignore itself before it picks the targets, so the commands
    # below turn biome's own .gitignore handling off. biome.jsonc keeps it on
    # for `pnpm biome` and editors, which run inside the repository.
    - name: biome
      files:
        - astro
        - commonjs
        - css
        - graphql
        - html
        - javascript
        - json
        - markdown
        - sass
        - typescript
        - yaml
      commands:
        - output: regex
          success_codes:
            - 0
            - 1
          batch: true
          cache_results: false
          name: lint
          parse_regex: (?m)^::(?P<severity>.*) title=(?P<code>[^,]+),file=(?P<path>[^,]+),line=(?P<line>[^,]+),endLine=[^,]+,col=(?P<col>[^,]+),endColumn=[^:]+::(?P<message>.*)
          read_output_from: stdout
          run: biome check --config-path=${workspace}/biome.jsonc --vcs-use-ignore-file=false --reporter=github --no-errors-on-unmatched ${target}
          run_from: ${root_or_parent_with(biome.jsonc)}
        - output: regex
          success_codes:
            - 0
          batch: true
          cache_results: false
          formatter: true
          name: fmt
          parse_regex: (?m)^::(?P<severity>.*) title=(?P<code>[^,]+),file=(?P<path>[^,]+),line=(?P<line>[^,]+),endLine=[^,]+,col=(?P<col>[^,]+),endColumn=[^:]+::(?P<message>.*)
          read_output_from: stdout
          run: biome format --config-path=${workspace}/biome.jsonc --vcs-use-ignore-file=false --reporter=github --write --no-errors-on-unmatched ${target}
          run_from: ${root_or_parent_with(biome.jsonc)}
      run_timeout: 1m
  enabled:
    - actionlint@1.17.0
    - biome@2.6.3! # datasource=npm depName=@biomejs/biome
    - git-diff-check
    - shellcheck@0.11.0
    - shfmt@3.14.1
    - taplo@0.10.0
    - yamlfmt@0.21.0
    - yamllint@1.38.0
  disabled:
    - checkov
    - grype
    - markdownlint
    - osv-scanner
    - oxfmt
    - oxipng
    - oxlint
    - pinact
    - prettier
    - renovate
    - svgo
    - trufflehog
  ignore:
    # Biome formats YAML, except the Kubernetes manifests of the resource
    # templates, whose sequences stay unindented as kubectl writes them. Biome
    # cannot do that, so yamlfmt formats only those, with the .yamlfmt.yaml of
    # their directory.
    - linters:
        - yamlfmt
      paths:
        - "**"
        - "!packages/resource-templates/templates/**"
    - linters:
        - biome
      paths:
        - packages/resource-templates/templates/**
    # Vitest/testing-library snapshots are generated artifacts whose DOM
    # serializer emits whitespace-only lines (e.g. indented empty elements and
    # inline SVG <style> blocks). git-diff-check only flags such lines when they
    # are newly added, so snapshot regeneration trips it inconsistently. Exclude
    # generated snapshots from git-diff-check.
    - linters:
        - git-diff-check
      paths:
        - "**/__snapshots__/**"
    # biome.jsonc excludes "**/build/**" (re-including only *.{js,cjs,mjs}, for
    # freelens/build/prebuild.cjs and notarize.cjs), but Trunk's own biome
    # linter definition above still hands it every build/*.json path it finds.
    # biome 2.5.4 treats a target excluded by its own config as a hard error
    # ("No files were processed in the specified paths", exit 1) rather than a
    # no-op, so any commit touching a generated build/*.json file -- for
    # example packages/kubectl-versions/build/checksums.json -- was permanently
    # blocked by trunk-fmt-pre-commit regardless of content. The commands above
    # also carry --no-errors-on-unmatched, since biome can still be invoked on
    # these paths outside Trunk (the `pnpm biome` alias AGENTS.md documents, an
    # editor integration); this entry is what saves Trunk the subprocess call.
    - linters:
        - biome
      paths:
        - "**/build/*.json"
actions:
  enabled:
    - trunk-announce
    - trunk-check-pre-push
    - trunk-fmt-pre-commit
    - trunk-upgrade-available
